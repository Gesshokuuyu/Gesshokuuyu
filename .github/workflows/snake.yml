name: Gerar animação da snake

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch:      # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animacao da snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF2D20&color_dots=%23161B22,%235C1616,%239E1C1C,%23E02424,%23FF2D20
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF2D20&color_dots=%23161B22,%235C1616,%239E1C1C,%23E02424,%23FF2D20

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}